name: 3D native 2D composition hybrid
on:
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/Preview.tsx'
      - 'src/three/hybrid-2d.ts'
      - 'src/three/Hybrid2DPlane.tsx'
      - 'src/three/Hybrid2DControls.tsx'
      - 'src/three/ThreePreview.tsx'
      - 'src/three/settings.ts'
      - 'src/three/project.ts'
      - 'tests/three-hybrid-2d.spec.ts'
      - '.github/workflows/three-hybrid-2d.yml'
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/Preview.tsx'
      - 'src/three/hybrid-2d.ts'
      - 'src/three/Hybrid2DPlane.tsx'
      - 'src/three/Hybrid2DControls.tsx'
      - 'src/three/ThreePreview.tsx'
      - 'src/three/settings.ts'
      - 'src/three/project.ts'
      - 'tests/three-hybrid-2d.spec.ts'
      - '.github/workflows/three-hybrid-2d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid-2d-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify 2D SVG plane, depth and project persistence
        run: npx playwright test tests/three-hybrid-2d.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hybrid-2d-browser-failure
          path: test-results/
          retention-days: 7
