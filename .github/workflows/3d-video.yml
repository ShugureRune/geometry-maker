name: 3D video rendering & export

on:
  push:
    branches: [main]
    paths:
      - 'src/three/ThreePreview.tsx'
      - 'src/three/ThreeExportPanel.tsx'
      - 'src/three/ThreeVideoPanel.tsx'
      - 'src/three/video.ts'
      - 'src/three/settings.ts'
      - 'src/three/three.css'
      - 'src/video.ts'
      - 'tests/three-video.spec.ts'
      - '.github/workflows/3d-video.yml'
  pull_request:
    paths:
      - 'src/three/ThreePreview.tsx'
      - 'src/three/ThreeExportPanel.tsx'
      - 'src/three/ThreeVideoPanel.tsx'
      - 'src/three/video.ts'
      - 'src/three/settings.ts'
      - 'src/three/three.css'
      - 'src/video.ts'
      - 'tests/three-video.spec.ts'
      - '.github/workflows/3d-video.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install video probe tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render and probe actual 3D WebM frames
        run: npx playwright test tests/three-video.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 3d-video-regressions
          path: test-results/
          retention-days: 7
