name: 2D grid browser checks

on:
  pull_request:
    paths:
      - 'src/GridBackground.tsx'
      - 'src/GridBackgroundControls.tsx'
      - 'src/grid-background.ts'
      - 'src/grid-background.test.tsx'
      - 'src/Preview.tsx'
      - 'src/App.tsx'
      - 'src/ExportPanel.tsx'
      - 'src/settings.ts'
      - 'tests/grid-background.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/grid-background-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check grid editing, exports, JSON restore and 3D isolation
        run: npx playwright test tests/grid-background.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: grid-browser-failures
          path: test-results/
          retention-days: 7
