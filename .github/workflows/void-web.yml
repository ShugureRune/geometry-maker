name: Large VOID cosmic web
on:
  pull_request:
    paths:
      - 'src/three/**'
      - 'src/App.tsx'
      - 'tests/void-web.spec.ts'
      - '.github/workflows/void-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/void-web.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: void-web-failures
          path: test-results/
          retention-days: 7
