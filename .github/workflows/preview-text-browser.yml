name: Preview text browser checks

on:
  pull_request:
    paths:
      - 'src/PreviewTextEditor.tsx'
      - 'src/App.tsx'
      - 'src/TextOverlay.tsx'
      - 'src/style.css'
      - 'tests/preview-text.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/preview-text-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test canvas text editing in Chromium
        run: npx playwright test tests/preview-text.spec.ts
