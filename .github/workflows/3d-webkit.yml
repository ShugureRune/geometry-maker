name: 3D iPhone-size WebKit startup

on:
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/studio-autosave.ts'
      - 'src/three/CircuitWorld.tsx'
      - 'src/three/circuit-world.ts'
      - 'src/three/circuit-shader.ts'
      - 'src/three/FloorGridControls.tsx'
      - 'src/three/FloorGrid.tsx'
      - 'src/three/ThreeBoundary.tsx'
      - 'src/three/ThreePreview.tsx'
      - 'src/three/three.css'
      - 'tests/three-webkit.spec.ts'
      - 'tests/studio-ui-webkit.spec.ts'
      - 'src/studio-redesign.css'
      - 'src/StudioCommandPalette.tsx'
      - 'src/main.tsx'
      - '.github/workflows/3d-webkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Start 3D preview on a WebKit mobile viewport
        run: npx playwright test tests/three-webkit.spec.ts tests/studio-ui-webkit.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-webkit-3d-failure
          path: test-results/
          retention-days: 7
