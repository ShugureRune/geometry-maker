name: VOID prototype and ordinary 3D parity
on:
  pull_request:
    paths:
      - 'src/three/**'
      - 'src/App.tsx'
      - 'tests/void-prototype.spec.ts'
      - '.github/workflows/void-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .void-reference
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve the unchanged base for exact ordinary-3D PNG comparison
        run: |
          # Separate React installations and optimizer caches for the two apps.
          # Sharing node_modules can mix Vite's prebundled React dispatchers.
          npm ci --prefix .void-reference
          (cd .void-reference && npm run dev -- --port 5180 --strictPort > "$RUNNER_TEMP/void-reference.log" 2>&1) &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5180 > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npx playwright test tests/void-prototype.spec.ts
        env:
          VOID_REFERENCE_URL: http://127.0.0.1:5180
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: void-prototype-failures
          path: test-results/
          retention-days: 7
