name: 3D browser checks

on:
  pull_request:
    paths:
      - 'src/three/**'
      - 'src/App.tsx'
      - 'src/SettingsCategories.tsx'
      - 'src/colors.ts'
      - 'src/themes.ts'
      - 'tests/three.spec.ts'
      - 'tests/three-spacing.spec.ts'
      - 'tests/three-sky.spec.ts'
      - 'tests/celestial.spec.ts'
      - 'tests/neon-network.spec.ts'
      - 'package*.json'
      - 'playwright.config.ts'
      - '.github/workflows/three-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check 3D interaction, output, mobile touch and 2D compatibility
        run: npx playwright test tests/three.spec.ts tests/neon-network.spec.ts tests/celestial.spec.ts tests/three-spacing.spec.ts tests/three-sky.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: three-browser-failures
          path: test-results/
          retention-days: 7
