name: 3D neural network entrance animation

on:
  push:
    branches: [main]
    paths:
      - 'src/three/entrance.ts'
      - 'src/three/ThreeControls.tsx'
      - 'src/three/StyleRenderer.tsx'
      - 'src/three/entrance.test.ts'
      - 'tests/three-neural-entrance.spec.ts'
      - '.github/workflows/three-neural-entrance.yml'
  pull_request:
    paths:
      - 'src/three/entrance.ts'
      - 'src/three/ThreeControls.tsx'
      - 'src/three/StyleRenderer.tsx'
      - 'src/three/entrance.test.ts'
      - 'tests/three-neural-entrance.spec.ts'
      - '.github/workflows/three-neural-entrance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-entrance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify new size-staged entrance and standby transitions
        run: npx playwright test tests/three-neural-entrance.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: neural-entrance-failure
          path: test-results/
          retention-days: 7
