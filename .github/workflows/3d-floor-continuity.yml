name: 3D floor continuity across standby switches

on:
  push:
    branches: [main]
    paths:
      - 'src/three/ThreePreview.tsx'
      - 'src/three/FloorGrid.tsx'
      - 'src/three/CircuitWorld.tsx'
      - 'src/three/floor-grid.ts'
      - 'tests/three-floor-continuity.spec.ts'
      - '.github/workflows/3d-floor-continuity.yml'
  pull_request:
    paths:
      - 'src/three/ThreePreview.tsx'
      - 'src/three/FloorGrid.tsx'
      - 'src/three/CircuitWorld.tsx'
      - 'src/three/floor-grid.ts'
      - 'tests/three-floor-continuity.spec.ts'
      - '.github/workflows/3d-floor-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Assert grid and circuit never rewind on standby morphs
        run: npx playwright test tests/three-floor-continuity.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 3d-floor-continuity-failure
          path: test-results/
          retention-days: 7
