name: 3D standby transition browser checks

on:
  pull_request:
    paths:
      - 'src/three/**'
      - 'src/App.tsx'
      - 'tests/three-standby.spec.ts'
      - '.github/workflows/three-standby-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify standby morph and exit-enter animations
        run: npx playwright test tests/three-standby.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: three-standby-failures
          path: test-results/
          retention-days: 7
